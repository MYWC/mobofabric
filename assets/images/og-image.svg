<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#40a0ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circle -->
  <circle cx="1050" cy="120" r="220" fill="#0071e3" opacity="0.06"/>
  <circle cx="150" cy="580" r="160" fill="#0071e3" opacity="0.05"/>

  <!-- Phone icon -->
  <g transform="translate(120 195)">
    <rect x="0" y="0" width="140" height="240" rx="28"
          fill="none" stroke="url(#accent)" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="70" cy="215" r="9" fill="#0071e3"/>
    <rect x="50" y="14" width="40" height="6" rx="3" fill="#0071e3" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="320" y="290"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="76" font-weight="800" fill="#1d1d1f"
        letter-spacing="-2">Phone Store</text>

  <!-- Subtitle -->
  <text x="320" y="355"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="28" font-weight="500" fill="#6e6e73">
    Minimal · Modern · Multilingual
  </text>

  <!-- Feature badges -->
  <g transform="translate(320 400)">
    <rect x="0"   y="0" width="180" height="42" rx="21" fill="#0071e3"/>
    <text x="90"  y="28" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Farsi / English</text>

    <rect x="196" y="0" width="150" height="42" rx="21" fill="#1d1d1f"/>
    <text x="271" y="28" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Dark mode</text>

    <rect x="362" y="0" width="176" height="42" rx="21" fill="none" stroke="#1d1d1f" stroke-width="2"/>
    <text x="450" y="28" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="middle">Supabase · Fast</text>
  </g>

  <!-- Bottom URL -->
  <text x="1160" y="590"
        font-family="system-ui, sans-serif"
        font-size="18" fill="#86868b" text-anchor="end">
    MYWC.github.io/mobofabric
  </text>
</svg>