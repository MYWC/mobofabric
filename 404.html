<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>۴۰۴ — صفحه یافت نشد | Phone Store</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 460px; }
    .code {
      font-size: 128px;
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
      color: #0071e3;
      margin-bottom: 24px;
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; }
    p  { font-size: 16px; color: #6e6e73; line-height: 1.7; margin-bottom: 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 500;
      text-decoration: none;
      transition: all 150ms cubic-bezier(.4,0,.2,1);
      font-size: 15px;
    }
    .btn-primary { background: #0071e3; color: #fff; }
    .btn-primary:hover { background: #0077ed; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: #1d1d1f; border: 1px solid #d2d2d7; }
    .btn-ghost:hover { background: #fff; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
      font-weight: 700;
      font-size: 18px;
      color: #1d1d1f;
    }
    .logo svg { color: #0071e3; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="2" width="12" height="20" rx="3"/>
        <circle cx="12" cy="18" r="1" fill="currentColor"/>
      </svg>
      Phone Store
    </div>

    <div class="code">۴۰۴</div>
    <h1>صفحه یافت نشد</h1>
    <p>متأسفانه صفحه‌ای که دنبالش بودید وجود ندارد یا منتقل شده است.</p>

    <div class="actions">
      <a class="btn-primary" href="./">بازگشت به فروشگاه</a>
      <a class="btn-ghost" href="./#/products">مشاهده محصولات</a>
    </div>
  </div>
</body>
</html>
