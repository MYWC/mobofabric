  <!-- ═══════════════════════════════════════════════════════════
       ⚡ PRELOADER — Critical CSS
       ═══════════════════════════════════════════════════════════ -->
  <style>
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      transition: opacity 600ms cubic-bezier(.4, 0, .2, 1),
                  visibility 600ms;
    }

    #preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    html.skip-preloader #preloader {
      display: none !important;
    }

    body.preloader-active {
      overflow: hidden;
    }

    .preloader-logo {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, #C9A961 0%, #E8D9A8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0B0B0F;
      box-shadow: 0 20px 60px rgba(201, 169, 97, 0.35),
                  0 8px 20px rgba(201, 169, 97, 0.2);
      animation: preloader-scale-in 700ms cubic-bezier(.34, 1.56, .64, 1) both;
    }

    .preloader-logo::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 28px;
      background: linear-gradient(135deg, #C9A961, #E8D9A8);
      opacity: 0;
      animation: preloader-pulse 2.2s ease-in-out infinite;
      z-index: -1;
    }

    .preloader-logo svg {
      width: 42px;
      height: 42px;
      display: block;
      position: relative;
      z-index: 1;
    }

    .preloader-title {
      font-family: 'Mahoor', 'Vazirmatn', system-ui, sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #1A1A1A;
      letter-spacing: -0.025em;
      animation: preloader-fade-up 700ms 200ms cubic-bezier(.4, 0, .2, 1) both;
    }

    .preloader-bar {
      width: 240px;
      height: 4px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      overflow: hidden;
      animation: preloader-fade-up 700ms 350ms cubic-bezier(.4, 0, .2, 1) both;
    }

    .preloader-bar__fill {
      position: relative;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #C9A961 0%, #E8D9A8 100%);
      border-radius: 999px;
      transition: width 250ms cubic-bezier(.4, 0, .2, 1);
      overflow: hidden;
    }

    .preloader-bar__fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.6) 50%, transparent 100%);
      animation: preloader-shimmer 1.4s linear infinite;
    }

    @keyframes preloader-scale-in {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes preloader-fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes preloader-pulse {
      0%, 100% { opacity: 0;    transform: scale(1); }
      50%      { opacity: 0.3;  transform: scale(1.18); }
    }

    @keyframes preloader-shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    [data-theme="dark"] #preloader { background: #0B0B0F; }
    [data-theme="dark"] .preloader-title { color: #F5F4F0; }
    [data-theme="dark"] .preloader-bar { background: rgba(255, 255, 255, 0.12); }

    @media (prefers-reduced-motion: reduce) {
      .preloader-logo,
      .preloader-title,
      .preloader-bar { animation: none !important; }
      .preloader-logo::before { animation: none !important; opacity: 0.15; }
      .preloader-bar__fill::after { animation: none !important; }
    }

    @media (max-width: 480px) {
      .preloader-logo { width: 68px; height: 68px; border-radius: 18px; }
      .preloader-logo svg { width: 36px; height: 36px; }
      .preloader-title { font-size: 19px; }
      .preloader-bar { width: 180px; }
    }
  </style>
